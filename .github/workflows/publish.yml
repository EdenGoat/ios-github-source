name: Update GitHub IPA Source

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'  # UTC，每 6 小时一次，可能延迟
  push:
    branches: [main]
    paths:
      - 'apps.json'
      - 'scripts/build_source.py'
      - '.github/workflows/publish.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-ipa-source
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build source and cache
        run: python scripts/build_source.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save cache to repository
        run: |
          if ! git diff --quiet -- data/cache.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/cache.json
            git commit -m "chore: update IPA metadata cache [skip ci]"

            if ! git push; then
              echo "::warning::缓存推送失败，可能是主分支已经更新。跳过缓存保存，继续部署软件源。"
            fi
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
